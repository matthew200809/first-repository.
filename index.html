<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Sem scripts ou estilos inline: a política abaixo bloqueia código injetado (XSS). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Eleva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/prefs.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
  <div id="toast-root" role="status"></div>
  <button id="inbox-btn" class="inbox-btn" type="button" title="Caixa de e-mail simulada">
    E-mail simulado <span id="inbox-count" class="badge hidden">0</span>
  </button>
  <noscript>O Eleva precisa de JavaScript ativado.</noscript>

  <script src="js/util.js"></script>
  <script src="js/security.js"></script>
  <script src="js/store.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/views-auth.js"></script>
  <script src="js/views-feed.js"></script>
  <script src="js/views-community.js"></script>
  <script src="js/views-zone.js"></script>
  <script src="js/views-profile.js"></script>
  <script src="js/views-settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
